<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>مكاننا · Makanona</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#10272F;--ink2:#5d747d;--bg:#E6ECEE;--ok:#2F8F6B;--bad:#C4483B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
#map{position:fixed;inset:0}
#card{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:500;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 4px 18px #0003;display:flex;flex-direction:column;gap:6px;max-width:520px;margin:0 auto}
#nm{font-size:18px;font-weight:800}
.st{font-size:13px;color:var(--ink2)}
.on{color:var(--ok);font-weight:700}
.btn{border:0;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;background:#10272F;color:#fff;cursor:pointer;text-decoration:none;text-align:center}
#msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;z-index:600;background:var(--bg)}
#msg b{display:block;font-size:20px;margin-bottom:8px}
.pin{width:46px;height:46px;border-radius:50%;background:#3A6EA5;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;border:3px solid #fff;box-shadow:0 2px 8px #0005}
.spd{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 1px 5px #0004}
.brand{font-size:12px;color:var(--ink2);text-align:center}
</style>
</head>
<body>
<div id="map"></div>
<div id="card" hidden>
  <div id="nm"></div>
  <div class="st" id="st"></div>
  <div class="st" id="exp"></div>
  <a class="btn" id="gm" target="_blank" rel="noopener"></a>
  <div class="brand" id="brand"></div>
</div>
<div id="msg"><div><b id="msg-t"></b><span class="st" id="msg-s"></span></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeAuth, inMemoryPersistence, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const CFG = {
  apiKey: "AIzaSyD_8AtkuLyDRovVGhIiWiiBErpKVQXBrsc",
  authDomain: "makanona.firebaseapp.com",
  databaseURL: "https://makanona-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "makanona",
  appId: "1:1089912633653:web:9d76d8c1c5047badd9347c"
};
/* نصوص الصفحة بسبع لغات حسب لغة المتصفح */
const T = {
  ar: { loading: "جارٍ فتح الموقع...", expired: "انتهت صلاحية هذا الرابط", expiredS: "أوقف صاحبه المشاركة أو انتهت مدتها.", bad: "الرابط غير صحيح", err: "تعذر فتح الموقع", errS: "تحقق من الإنترنت وحاول مرة أخرى.", now: "متصل الآن", ago: "آخر تحديث قبل {0}", until: "تنتهي المشاركة {0}", gm: "افتح في خرائط Google", brand: "مشاركة مؤقتة من تطبيق مكاننا", min: "{0} دقيقة", hr: "{0} ساعة", sec: "لحظات", kmh: "{0} كم/س", wait: "لم يصل موقعه بعد" },
  en: { loading: "Opening location...", expired: "This link has expired", expiredS: "The owner stopped sharing or the time ran out.", bad: "Invalid link", err: "Couldn't open the location", errS: "Check your internet and try again.", now: "Online now", ago: "Updated {0} ago", until: "Sharing ends {0}", gm: "Open in Google Maps", brand: "Temporary share from the Makanona app", min: "{0} min", hr: "{0} h", sec: "moments", kmh: "{0} km/h", wait: "No location yet" },
  de: { loading: "Standort wird geöffnet...", expired: "Dieser Link ist abgelaufen", expiredS: "Das Teilen wurde beendet oder die Zeit ist um.", bad: "Ungültiger Link", err: "Standort konnte nicht geöffnet werden", errS: "Prüfe dein Internet und versuche es erneut.", now: "Jetzt online", ago: "Vor {0} aktualisiert", until: "Teilen endet {0}", gm: "In Google Maps öffnen", brand: "Vorübergehend geteilt mit der Makanona-App", min: "{0} Min.", hr: "{0} Std.", sec: "Momenten", kmh: "{0} km/h", wait: "Noch kein Standort" },
  tr: { loading: "Konum açılıyor...", expired: "Bu bağlantının süresi doldu", expiredS: "Sahibi paylaşımı durdurdu veya süre bitti.", bad: "Geçersiz bağlantı", err: "Konum açılamadı", errS: "İnternetini kontrol edip tekrar dene.", now: "Şu an çevrimiçi", ago: "{0} önce güncellendi", until: "Paylaşım {0} biter", gm: "Google Haritalar'da aç", brand: "Makanona uygulamasından geçici paylaşım", min: "{0} dk", hr: "{0} sa", sec: "az", kmh: "{0} km/s", wait: "Henüz konum yok" },
  ru: { loading: "Открываем местоположение...", expired: "Срок действия ссылки истёк", expiredS: "Владелец остановил передачу или время вышло.", bad: "Неверная ссылка", err: "Не удалось открыть местоположение", errS: "Проверьте интернет и попробуйте снова.", now: "Сейчас в сети", ago: "Обновлено {0} назад", until: "Передача закончится {0}", gm: "Открыть в Google Картах", brand: "Временная передача из приложения Makanona", min: "{0} мин", hr: "{0} ч", sec: "несколько секунд", kmh: "{0} км/ч", wait: "Местоположения пока нет" },
  nl: { loading: "Locatie openen...", expired: "Deze link is verlopen", expiredS: "Het delen is gestopt of de tijd is om.", bad: "Ongeldige link", err: "Locatie kon niet worden geopend", errS: "Controleer je internet en probeer opnieuw.", now: "Nu online", ago: "{0} geleden bijgewerkt", until: "Delen stopt {0}", gm: "Openen in Google Maps", brand: "Tijdelijk gedeeld via de Makanona-app", min: "{0} min", hr: "{0} u", sec: "enkele ogenblikken", kmh: "{0} km/u", wait: "Nog geen locatie" },
  fr: { loading: "Ouverture de la position...", expired: "Ce lien a expiré", expiredS: "Le partage a été arrêté ou le délai est écoulé.", bad: "Lien invalide", err: "Impossible d'ouvrir la position", errS: "Vérifiez votre connexion et réessayez.", now: "En ligne", ago: "Mis à jour il y a {0}", until: "Le partage se termine {0}", gm: "Ouvrir dans Google Maps", brand: "Partage temporaire depuis l'application Makanona", min: "{0} min", hr: "{0} h", sec: "quelques instants", kmh: "{0} km/h", wait: "Pas encore de position" }
};
const pick = (navigator.languages || [navigator.language || 'ar']).map(x => String(x).slice(0, 2).toLowerCase()).find(x => T[x]) || 'en';
const L_ = T[pick], LOC = pick === 'ar' ? 'ar' : pick;
document.documentElement.lang = pick; document.documentElement.dir = pick === 'ar' ? 'rtl' : 'ltr';
const tx = (k, v) => String(L_[k]).replace('{0}', v);
const $ = id => document.getElementById(id);
const msg = (t, s = '') => { $('msg-t').textContent = t; $('msg-s').textContent = s; $('msg').hidden = false; $('card').hidden = true; };
const agoTxt = ts => { const s = Math.max(0, (Date.now() - ts) / 1000); return s < 60 ? L_.sec : s < 3600 ? tx('min', Math.round(s / 60)) : tx('hr', Math.round(s / 3600)); };
const when = ts => new Date(ts).toLocaleString(LOC, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
msg(L_.loading);

const tok = ((location.hash + '&' + location.search).match(/[#?&]t=([A-Za-z0-9]{20,40})/) || [])[1];
if (!tok) msg(L_.bad);
else start().catch(e => { console.error(e); msg(L_.err, L_.errS); });

async function start() {
  const app = initializeApp(CFG, 'share');                     // تطبيق منفصل: لا يمس جلسة صاحب الحساب إن فُتح في متصفحه
  const db = getDatabase(app);
  const sh = (await get(ref(db, 'shares/' + tok))).val();
  if (!sh || !(sh.exp > Date.now())) return msg(L_.expired, L_.expiredS);
  const auth = initializeAuth(app, { persistence: inMemoryPersistence });
  await signInAnonymously(auth);
  await set(ref(db, 'shareView/' + auth.currentUser.uid), tok);
  const name = sh.name || 'Makanona';
  $('nm').textContent = name; $('gm').textContent = L_.gm; $('brand').textContent = L_.brand;
  $('exp').textContent = tx('until', when(sh.exp));
  const map = L.map('map', { zoomControl: false }).setView([35, 38], 6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  let mk = null, last = null, first = true;
  const draw = () => {
    if (Date.now() > sh.exp) { off(); return msg(L_.expired, L_.expiredS); }
    if (!last || typeof last.lat !== 'number') { $('msg').hidden = true; $('card').hidden = false; $('st').textContent = L_.wait; return; }
    const fresh = Date.now() - last.ts < 180000, kmh = typeof last.spd === 'number' ? Math.round(last.spd * 3.6) : 0;
    const html = `<div style="position:relative"><div class="pin">${(name.trim()[0] || '?').replace(/[<>&"]/g, '')}</div>${fresh && kmh >= 5 ? `<span class="spd">${tx('kmh', kmh)}</span>` : ''}</div>`;
    const icon = L.divIcon({ className: '', html, iconSize: [46, 46], iconAnchor: [23, 23] });
    if (!mk) mk = L.marker([last.lat, last.lng], { icon }).addTo(map); else { mk.setLatLng([last.lat, last.lng]); mk.setIcon(icon); }
    if (first) { map.setView([last.lat, last.lng], 16); first = false; }
    $('st').innerHTML = fresh ? `<span class="on">${L_.now}</span>` : tx('ago', agoTxt(last.ts));
    $('gm').href = `https://www.google.com/maps/search/?api=1&query=${last.lat.toFixed(6)},${last.lng.toFixed(6)}`;
    $('msg').hidden = true; $('card').hidden = false;
  };
  const off = onValue(ref(db, 'locations/' + sh.uid), s => { last = s.val(); draw(); }, e => { console.error(e); msg(L_.expired, L_.expiredS); });
  // إيقاف صاحبه للمشاركة يُنهي العرض فوراً
  onValue(ref(db, 'shares/' + tok), s => { const v = s.val(); if (!v || !(v.exp > Date.now())) { off(); msg(L_.expired, L_.expiredS); } else { sh.exp = v.exp; $('exp').textContent = tx('until', when(sh.exp)); } }, () => { off(); msg(L_.expired, L_.expiredS); });
  setInterval(draw, 15000);
}
</script>
</body>
</html>
